name: Native Swift checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select runner Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Toolchain
        run: swift --version
      - name: Spanish catalog
        run: python3 script/sync_localization.py --check
      - name: Native and core tests
        run: ./script/test.sh
      - name: Build and validate app bundle
        run: ./script/build_and_run.sh --build-only
